name: Tariff Comparison 3D QA

on:
  pull_request:
    paths:
      - "src/components/package-comparison-3d.tsx"
      - "src/components/package-comparison-3d.module.css"
      - "src/components/package-layers.tsx"
      - "tests/tariff-comparison-3d.spec.ts"
      - ".github/workflows/tariff-comparison-3d-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/tariff-comparison-3d.spec.ts --project=desktop-chromium --project=mobile-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tariff-comparison-3d-screenshots
          path: test-results/
          if-no-files-found: ignore
