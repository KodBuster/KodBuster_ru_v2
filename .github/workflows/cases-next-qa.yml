name: CASES NEXT visual QA

on:
  pull_request:
    paths:
      - 'src/components/portfolio-reel-v2.tsx'
      - 'src/components/portfolio-reel-v2.module.css'
      - 'src/app/page.tsx'
      - 'tests/cases-next.spec.ts'
      - '.github/workflows/cases-next-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cases-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test tests/cases-next.spec.ts --project=desktop-chromium --project=mobile-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cases-next-visual-qa
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
